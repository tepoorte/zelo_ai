services:
  ollama:
    image: ollama/ollama:latest
    container_name: zelo-ai-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai

  zelo_ai:
    container_name: zelo_ai
    image: ${DOCKERREGISTRY}/${IMAGENAME}:${VERSION}
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_PLANNER_MODEL=${OLLAMA_PLANNER_MODEL}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_GRAPH_TOKEN=${META_GRAPH_TOKEN}
      - META_WHATSAPP_PHONE_NUMBER_ID=${META_WHATSAPP_PHONE_NUMBER_ID}
      - META_WHATSAPP_BUSINESS_ACCOUNT_ID=${META_WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER}
      - WHATSAPP_ADMIN_TOKEN=${WHATSAPP_ADMIN_TOKEN}
      - WHATSAPP_SESSION_DIR=${WHATSAPP_SESSION_DIR}
      - WHATSAPP_TEST_PHONE=${WHATSAPP_TEST_PHONE}
      - WHATSAPP_ALLOWED_PHONES=${WHATSAPP_ALLOWED_PHONES}
      - WHATSAPP_AUTH_MODE=${WHATSAPP_AUTH_MODE}
      - WHATSAPP_OTP_TTL_MINUTES=${WHATSAPP_OTP_TTL_MINUTES}
      - WHATSAPP_OTP_MAX_ATTEMPTS=${WHATSAPP_OTP_MAX_ATTEMPTS}
      - WHATSAPP_OTP_RESEND_COOLDOWN_SECONDS=${WHATSAPP_OTP_RESEND_COOLDOWN_SECONDS}
      - WHATSAPP_SESSION_TTL_HOURS=${WHATSAPP_SESSION_TTL_HOURS}
      - WHATSAPP_ONBOARDING_URL=${WHATSAPP_ONBOARDING_URL}
      - WHATSAPP_ONBOARDING_TTL_MINUTES=${WHATSAPP_ONBOARDING_TTL_MINUTES}
      - WHATSAPP_ONBOARDING_MAX_ATTEMPTS=${WHATSAPP_ONBOARDING_MAX_ATTEMPTS}
      - WHATSAPP_ONBOARDING_LOCK_MINUTES=${WHATSAPP_ONBOARDING_LOCK_MINUTES}
      - WHATSAPP_ONBOARDING_STATE_KEY=${WHATSAPP_ONBOARDING_STATE_KEY}
      - ZELO_TEST_USERNAME=${ZELO_TEST_USERNAME}
      - ZELO_TEST_PASSWORD=${ZELO_TEST_PASSWORD}
      - SWISSDATA_BASE_URL=${SWISSDATA_BASE_URL}
      - SWISSDATA_API_KEY=${SWISSDATA_API_KEY}
      - SWISSDATA_APP_ID=${SWISSDATA_APP_ID}
      - SWISSDATA_SHOP_ID=${SWISSDATA_SHOP_ID}
      - SWISSDATA_COUNTRY=${SWISSDATA_COUNTRY}
      - SWISSDATA_ADMIN_TOKEN=${SWISSDATA_ADMIN_TOKEN}
      - SWISSDATA_ADMIN_USERNAME=${SWISSDATA_ADMIN_USERNAME}
      - SWISSDATA_ADMIN_PASSWORD=${SWISSDATA_ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - ./.cache:/app/.cache
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXYNET}"
      - "traefik.http.routers.zeloai-http.rule=Host(`${AI_HOST}`)"
      - "traefik.http.routers.zeloai-http.entrypoints=http"
      - "traefik.http.routers.zeloai-http.middlewares=zeloai-https"
      - "traefik.http.middlewares.zeloai-https.redirectscheme.scheme=https"
      - "traefik.http.routers.zeloai.rule=Host(`${AI_HOST}`)"
      - "traefik.http.routers.zeloai.entrypoints=https"
      - "traefik.http.routers.zeloai.tls=true"
      - "traefik.http.routers.zeloai.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.services.zeloai.loadbalancer.server.port=3041"
    networks:
      - ai
      - proxy
    command: ["node", "dist/server.js"]

networks:
  proxy:
    name: ${PROXYNET}
    external: true
  ai:

volumes:
  ollama_data:
