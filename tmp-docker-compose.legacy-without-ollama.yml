# Legacy compose kept only as historical reference. Local dev uses docker-compose-dev.yml;
# production deploy uses deploy/docker-compose.with-ollama.yml.
services:
  zelo_ai:
    container_name: zelo_ai
    image: ${DOCKERREGISTRY}/${IMAGENAME}:${VERSION}
    ports:
      - "${AI_PORT}:3041" #change the left one
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_PLANNER_MODEL=${OLLAMA_PLANNER_MODEL}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_GRAPH_TOKEN=${META_GRAPH_TOKEN}
      - META_WHATSAPP_PHONE_NUMBER_ID=${META_WHATSAPP_PHONE_NUMBER_ID}
      - META_WHATSAPP_BUSINESS_ACCOUNT_ID=${META_WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER}
      - WHATSAPP_ADMIN_TOKEN=${WHATSAPP_ADMIN_TOKEN}
      - WHATSAPP_SESSION_DIR=${WHATSAPP_SESSION_DIR}
      - WHATSAPP_TEST_PHONE=${WHATSAPP_TEST_PHONE}
      - ZELO_TEST_USERNAME=${ZELO_TEST_USERNAME}
      - ZELO_TEST_PASSWORD=${ZELO_TEST_PASSWORD}
      - SWISSDATA_BASE_URL=${SWISSDATA_BASE_URL}
      - SWISSDATA_API_KEY=${SWISSDATA_API_KEY}
      - SWISSDATA_APP_ID=${SWISSDATA_APP_ID}
      - SWISSDATA_SHOP_ID=${SWISSDATA_SHOP_ID}
      - SWISSDATA_COUNTRY=${SWISSDATA_COUNTRY}
    volumes:
      - ./.cache:/app/.cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zeloai.rule=Host(`${AI_HOST}`)"
      - "traefik.http.routers.zeloai.entrypoints=http,https"
      - "traefik.http.routers.zeloai.tls=true"
      - "traefik.http.routers.zeloai.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.services.zeloai.loadbalancer.server.port=3041"
    restart: unless-stopped
    networks:
      - proxy
    command: ["node", "dist/server.js"]

#volumes:
  #ollama_data:

networks:
  proxy:
      name: ${PROXYNET}
      external: true
