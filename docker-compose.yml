services:
  zelo_ai:
    container_name: zelo_ai
    image: ${DOCKERREGISTRY}/${IMAGENAME}:${VERSION}
    ports:
      - "${AI_PORT}:3041" #change the left one
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_PLANNER_MODEL=${OLLAMA_PLANNER_MODEL}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_GRAPH_TOKEN=${META_GRAPH_TOKEN}
      - SWISSDATA_BASE_URL=${SWISSDATA_BASE_URL}
      - SWISSDATA_API_KEY=${SWISSDATA_API_KEY}
      - SWISSDATA_APP_ID=${SWISSDATA_APP_ID}
      - SWISSDATA_SHOP_ID=${SWISSDATA_SHOP_ID}
      - SWISSDATA_COUNTRY=${SWISSDATA_COUNTRY}
    #volumes:
      #- ./:/app
      #- /app/node_modules
    command: ["node", "dist/server.js"]
    restart: unless-stopped

